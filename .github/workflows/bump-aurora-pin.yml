# Manual-only helper that opens an aurora2 PR bumping the foedag submodule pin
# to the current develop HEAD.
#
# Deliberately NOT triggered by merges into develop. A FOEDAG change almost
# always needs matching aurora2 changes, so the pin bump belongs in the
# developer's aurora2 PR, next to the code that requires it; an independent bot
# bump races that PR and can land a foedag SHA on master ahead of its companion
# changes. Dispatch this only for a FOEDAG change that is genuinely standalone
# (GUI-only fix, macOS build fix).
#
# Re-running does not pile up duplicate PRs: it force-pushes the same branch,
# which refreshes the existing open PR to the latest SHA.

name: bump-aurora-pin

on:
  workflow_dispatch:

concurrency:
  group: bump-aurora-pin
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token (QL-Proprietary)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: QL-Proprietary
          repositories: aurora2

      - name: Checkout aurora2 (master, no submodules)
        uses: actions/checkout@v5
        with:
          repository: QL-Proprietary/aurora2
          ref: master
          token: ${{ steps.app-token.outputs.token }}
          path: aurora2
          fetch-depth: 1

      - name: Bump foedag pin + open/update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd aurora2
          git config user.name  "aurora-tabbycad-automation-bot[bot]"
          git config user.email "aurora-tabbycad-automation-bot[bot]@users.noreply.github.com"

          cur=$(git ls-tree HEAD foedag/foedag-gh | awk '{print $3}')
          echo "aurora2 master foedag pin: current=$cur  new=$NEW"
          if [ "$cur" = "$NEW" ]; then echo "already up to date — nothing to do"; exit 0; fi

          pr_branch="auto/bump-foedag-pin"
          git checkout -B "$pr_branch"
          # Set the gitlink from the index (NOT `git add` — the submodule isn't checked out).
          git update-index --cacheinfo 160000,"$NEW",foedag/foedag-gh
          git commit -q -m "Bump foedag submodule to ${NEW:0:8}"
          git push -f origin "$pr_branch"

          if gh pr view "$pr_branch" --repo QL-Proprietary/aurora2 --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR for $pr_branch already open — refreshed by the force-push"
          else
            gh pr create --repo QL-Proprietary/aurora2 --base master --head "$pr_branch" \
              --title "Bump foedag submodule to ${NEW:0:8}" \
              --body "Manually requested bump of aurora2's foedag pin to \`${NEW}\` (FOEDAG \`develop\` HEAD). Only correct for a standalone FOEDAG change — if this change needs aurora2-side changes, close this and bump the pin in that aurora2 PR instead. Merge after CI and, for platform-specific changes, manual verification (aurora2 CI does not cover macOS)."
          fi
